name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilation + tests + couverture (JaCoCo)
        run: ./mvnw -B -ntp verify

      - name: Resume de la couverture
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Couverture lignes : %.1f %% (%d/%d)\n", 100*c/(m+c), c, m+c}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            target/surefire-reports/
            target/site/jacoco/

  qualite:
    name: Qualite (Checkstyle, PMD, SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilation
        run: ./mvnw -B -ntp -DskipTests compile

      # chaque outil dans son step pour voir tous les resultats meme si un echoue
      - name: Checkstyle
        if: always()
        run: ./mvnw -B -ntp checkstyle:check

      - name: PMD
        if: always()
        run: ./mvnw -B -ntp pmd:check

      - name: SpotBugs
        if: always()
        run: ./mvnw -B -ntp spotbugs:check

      - name: Rapports qualite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-qualite
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
