name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilation + tests + couverture (JaCoCo)
        run: ./mvnw -B -ntp verify

      - name: Resume de la couverture
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Couverture lignes : %.1f %% (%d/%d)\n", 100*c/(m+c), c, m+c}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            target/surefire-reports/
            target/site/jacoco/

  qualite:
    name: Qualite (Checkstyle, PMD, SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilation
        run: ./mvnw -B -ntp -DskipTests compile

      # chaque outil dans son step pour voir tous les resultats meme si un echoue
      - name: Checkstyle
        if: always()
        run: ./mvnw -B -ntp checkstyle:check

      - name: PMD
        if: always()
        run: ./mvnw -B -ntp pmd:check

      - name: SpotBugs
        if: always()
        run: ./mvnw -B -ntp spotbugs:check

      - name: Rapports qualite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-qualite
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml

  sonarcloud:
    name: SonarCloud
    needs: build-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historique complet pour la detection du nouveau code

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Pas de token
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Secret SONAR_TOKEN absent, analyse SonarCloud ignoree"

      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar

  package:
    name: Livrable (jar)
    needs: [ build-test, qualite ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Packaging
        run: ./mvnw -B -ntp -DskipTests package

      - uses: actions/upload-artifact@v4
        with:
          name: latice-jar
          path: target/latice-*.jar
